<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* 版面：整頁是家裡的 3D 畫面；左上說明、右上平面小地圖、下方提示、左下搖桿、右下按鈕 */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#1d1a18; --panel:rgba(38,33,30,.9); --ink:#f1ebe3; --muted:#b3a89c;
  --line:rgba(255,240,220,.18); --accent:#e46f55; --accent-ink:#1d1a18; color-scheme:dark } }
:root[data-theme="dark"]{
  --ground:#1d1a18; --panel:rgba(38,33,30,.9); --ink:#f1ebe3; --muted:#b3a89c;
  --line:rgba(255,240,220,.18); --accent:#e46f55; --accent-ink:#1d1a18; color-scheme:dark }
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:#0b0f16}
canvas#c{display:block;width:100%;height:100%;outline:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
#info{top:16px;left:16px;padding:12px 14px;max-width:min(290px,calc(100% - 32px))}
#info h1{font-family:var(--display);font-size:20px;margin:0 0 4px;letter-spacing:.04em}
#info p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
#info kbd{font-family:var(--body);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink)}

<div id="stage">
  <canvas id="c" tabindex="0" aria-label="家裡的 3D 場景"></canvas>
  <div id="info" class="panel">
    <h1>家裡走走</h1>
    <p>格局依掃地機器人地圖，每個房間都照你拍的照片布置。</p>
    <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　<kbd>E</kbd> 互動　<kbd>空白</kbd> 跳　<kbd>C</kbd> 換衣服　<kbd>Q</kbd> 換人　<kbd>F</kbd> 跟隨　<kbd>Shift</kbd> 快跑　<kbd>N</kbd> 日夜　<kbd>V</kbd> 小飛碟（飛行時 <kbd>空白</kbd> 上升、<kbd>X</kbd> 下降）　靠近另一人按 <kbd>E</kbd> 打屁股　<kbd>R</kbd> 重置　拖曳轉視角　滾輪縮放</p>
  </div>
  <div id="map" class="panel"><canvas id="mini" width="234" height="320"></canvas><div id="room">走廊</div></div>
  <div id="toast" class="panel" hidden></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="swap" class="btn" type="button">換人（Q）</button>
  <div id="tools"><button id="netB" class="tbtn" type="button">線上：準備中</button><button id="jumpB" class="tbtn" type="button">跳（空白鍵）</button><button id="dressB" class="tbtn" type="button">換衣服（C）</button><button id="runB" class="tbtn" type="button">快跑：關（Shift）</button><button id="dayB" class="tbtn" type="button">切換夜晚（N）</button><button id="followB" class="tbtn" type="button">跟著走：關（F）</button><button id="resetB" class="tbtn" type="button">卡住了？重置（R）</button><button id="flyB" class="tbtn" type="button">小飛碟：關（V）</button><button id="flyUp" class="tbtn" type="button" hidden>上升（空白鍵）</button><button id="flyDn" class="tbtn" type="button" hidden>下降（X）</button></div>
  <button id="act" class="btn" type="button">互動</button>
  <div id="pick" class="panel" hidden role="dialog" aria-label="選擇你的角色"><h2>選擇你的角色</h2><p>大家打開同一個網址就會在同一個空間。每個人選一位家人，別人選走的就不能選。</p><label id="nickRow" hidden style="display:block;margin:0 0 10px;font-size:13px;color:var(--muted)">你的名字（顯示在角色頭上）<input id="nick" maxlength="12" autocomplete="nickname" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:500 15px var(--body)"></label><div id="pickList"></div><button id="pickClose" class="tbtn" type="button">先不選，繼續看</button></div>
</div>

    if(p&&i!==NET.mine){const pr=p.presence;inRoom.add(i);if(!k.remote){k.remote=true;k.seat=null;if(k===A){const free=kids.find((q,j)=>!cl[j]&&q!==A);if(free){A.seat=sitting;A=free;pos=A.pos;sitting=null;}}}
      const tx=+pr.x||0,tz=+pr.z||0,d=Math.hypot(tx-k.pos.x,tz-k.pos.z);
      if(d>3){k.pos.x=tx;k.pos.z=tz;}else{const f=Math.min(1,dt*12);k.pos.x+=(tx-k.pos.x)*f;k.pos.z+=(tz-k.pos.z)*f;}
      let dh=(+pr.h||0)-k.heading;while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;k.heading+=dh*Math.min(1,dt*12);
      k.rmv=d>0.02&&!(pr.s>0);if(k.rmv)k.walkT+=dt*Math.min(3,d/Math.max(dt,0.016))*5.2;
      k.seat=pr.s>0?{h:+pr.s}:null;k.jh=Math.max(0,+pr.y||0);k.jv=0;if(typeof pr.o==='number'&&pr.o!==k.outfit&&OUTFITS[pr.o])dress(k,pr.o);
      tagFor(k,k.name+'・'+nameOf(p));k.tag.position.set(k.pos.x,(k.seat?k.seat.h+0.95:1.75)*(k.sc||1)+k.jh,k.pos.z);}
    else{if(k.remote){k.remote=false;k.rmv=false;k.seat=null;}if(k.tag)k.tag.visible=false;}});
  pickF();if(!pickEl.hidden)renderPicker();
  const n=NET.peers.filter(p=>p.kind==='viewer').length;netBtn.textContent='選角色（線上 '+n+' 人）';
  sendPresence(false);}
function netStatus(t){netBtn.hidden=false;netBtn.textContent=t;}
function netGoOnline(){if(NET.on)return;NET.on=true;pickEl.hidden=false;renderPicker();sendPresence(true);setTimeout(lateSync,2500);}
// ---------- 自架版（不在 claude.ai 裡打開時）：用公開的 MQTT 中繼站同步，不用登入 ----------
// 網址加 ?room=名稱 可以開不同的房間；沒加就是自己家的預設房間。同一個房間的人會在同一個空間。
const MQ_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const MQ_LIB='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';
function mqRoomName(){let r='';try{const u=new URL(location.href);r=u.searchParams.get('room')||(u.hash.match(/room=([^&]+)/)||[])[1]||'';}catch(e){}
  r=decodeURIComponent(r||'').replace(/[^\w\-一-鿿]/g,'').slice(0,40);return r||'liu-home-taichung';}
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function loadScript(src){return new Promise((ok,no)=>{if(window.mqtt)return ok();const s=document.createElement('script');s.src=src;s.onload=()=>ok();s.onerror=()=>no(new Error('load'));document.head.appendChild(s);});}
function makeMqRoom(roomName,getName,onName){
  const id=(Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4));
  const topic='jiazou/v1/'+roomName+'/p',bye='jiazou/v1/'+roomName+'/bye';
  const peers=new Map(),me={peer:id,by:id,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:{}};
  let seq=0,lastT=0,lastStr='',connCb=null,failCb=null,peersCb=null,up=0,dead=0;const cl=[];
  const list=()=>[me].concat([...peers.values()].map(p=>({peer:p.peer,by:p.peer,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:p.presence})));
  const tell=j=>{if(peersCb)try{peersCb({peers:list(),joined:j||[],left:[]});}catch(e){}};
  function pub(force){const now=Date.now(),str=JSON.stringify(me.presence);
    if(!force&&((now-lastT<90)||(str===lastStr&&now-lastT<1000)))return;lastT=now;lastStr=str;
    const msg=JSON.stringify({id,nm:(getName()||'').slice(0,12),t:++seq,p:me.presence});cl.forEach(c=>{if(c.connected)try{c.publish(topic,msg,{qos:0});}catch(e){}});}
  function onMsg(tp,buf){let d;try{d=JSON.parse(typeof buf==='string'?buf:new TextDecoder().decode(buf));}catch(e){return;}
    if(!d||typeof d!=='object'||typeof d.id!=='string'||d.id===id||d.id.length>24)return;
    if(tp===bye){if(peers.delete(d.id))tell();return;}
    const old=peers.get(d.id),t=+d.t||0;if(old&&t<=old.t)return;// 兩個中繼站會收到同一則，舊的丟掉
    const pr=(d.p&&typeof d.p==='object')?d.p:{};peers.set(d.id,{peer:d.id,presence:pr,last:Date.now(),t});
    if(typeof d.nm==='string')onName(d.id,d.nm.slice(0,12));
    if(!old){tell([{peer:d.id}]);pub(true);}}
  setInterval(()=>{const now=Date.now();let ch=false;peers.forEach((p,k)=>{if(now-p.last>9000){peers.delete(k);ch=true;}});if(ch)tell();},1000);
  MQ_BROKERS.forEach(url=>{let c;try{c=mqtt.connect(url,{clientId:'jz_'+id+'_'+cl.length,keepalive:30,reconnectPeriod:4000,connectTimeout:9000,clean:true,
      will:{topic:bye,payload:JSON.stringify({id}),qos:0,retain:false}});}catch(e){dead++;return;}
    cl.push(c);let was=false;
    c.on('connect',()=>{c.subscribe(['jiazou/v1/'+roomName+'/#'],{qos:0});if(!was){was=true;up++;}if(connCb)connCb(true);pub(true);});
    c.on('message',onMsg);
    c.on('close',()=>{if(was){was=false;up--;}if(!up&&connCb)connCb(false);});
    c.on('error',()=>{});});
  const leave=()=>{const m=JSON.stringify({id});cl.forEach(c=>{try{if(c.connected)c.publish(bye,m);c.end(true);}catch(e){}});};
  window.addEventListener('pagehide',leave);
  setTimeout(()=>{if(!up&&failCb)failCb({code:'unreachable'});},12000);
  return {presence(p){me.presence=p||{};pub(false);return Promise.resolve();},peers:list,connected:()=>up>0,
    onConnection(cb,fail){connCb=cb;failCb=fail;if(up)cb(true);},onPeers(cb){peersCb=cb;},roomName};}
async function netStartSelf(){
  netStatus('線上：連線中…');const nick=document.getElementById('nick');document.getElementById('nickRow').hidden=false;
  nick.value=lsGet('jz-name');nick.addEventListener('input',()=>{lsSet('jz-name',nick.value.trim());sendPresence(true);});
  try{await loadScript(MQ_LIB);}catch(e){netStatus('線上：無法連線');NET.why='連線元件載入失敗，請確認有連上網路後重新整理。';return;}
  const rn=mqRoomName();
  const room=makeMqRoom(rn,()=>nick.value.trim(),(id,nm)=>{if(NET.names[id]!==nm){NET.names[id]=nm;pickKey='';}});NET.room=room;
  const fail=()=>{if(NET.on)return;netStatus('線上：無法連線');NET.why='連不上同步伺服器。可能是網路（公司或學校網路常會擋）的關係，換手機網路或重新整理再試一次。';};
  room.onPeers(ch=>{NET.peers=ch.peers;if(room.connected())netGoOnline();if(ch.joined.length)NET.stT=0;});
  room.onConnection(c=>{if(c)netGoOnline();else if(!NET.on)netStatus('線上：連線中…');},fail);}
async function netStart(){
  if(!window.claude||!window.claude.use){netStartSelf();return;}
  netStatus('線上：連線中…');
  try{const pm=await claude.use('permissions');if(pm&&pm.request)await pm.request(['room','user']).catch(()=>{});}catch(e){}
  let room=null,user=null;try{[room,user]=await Promise.all([claude.use('room'),claude.use('user')]);}catch(e){}
  if(!room){netStatus('線上：無法連線');NET.why='這個裝置或開啟方式不支援多人同房。請登入 Claude，用分享選單收到的連結，在 claude.ai 網頁或最新版 App 打開；只用公開連結、沒登入時無法連線。';return;}
  NET.room=room;NET.user=user;
  const fail=e=>{NET.on=false;pickEl.hidden=true;kids.forEach(k=>{k.remote=false;if(k.tag)k.tag.visible=false;});netStatus('線上：無法連線');
    NET.why=(e&&e.code==='not_granted')?'你的帳號目前沒有連線權限。請作品擁有者從分享選單用 Email 邀請你，再用那個連結打開。':'連線中斷了，重新整理頁面再試一次。';};
  room.presence({j:NET.j,c:-1}).catch(e=>{if(e&&(e.code==='not_granted'||e.code==='revoked'))fail(e);});
  room.onConnection(c=>{if(c)netGoOnline();else if(!NET.on)netStatus('線上：連線中…');},fail);
  room.onPeers(ch=>{NET.peers=ch.peers;if(room.connected&&room.connected())netGoOnline();const ids=[...new Set(ch.peers.map(p=>p.by).filter(Boolean))].filter(id=>!(id in NET.names));
    if(ids.length&&user&&user.profiles)user.profiles(ids).then(ps=>{ids.forEach(id=>{NET.names[id]=(ps&&ps[id]&&ps[id].name)||'';});if(!pickEl.hidden)renderPicker();}).catch(()=>{});
    if(ch.joined.some(p=>!p.isMe))NET.stT=0;},fail);
  setTimeout(()=>{if(!NET.on&&room.connected&&room.connected())netGoOnline();else if(!NET.on&&!NET.why){netStatus('線上：連不上');NET.why='等了 8 秒還是連不上。請確認已登入 Claude，或重新整理頁面。';}},8000);}
netBtn.addEventListener('click',()=>{if(!NET.on){say(NET.why||'正在連線，請稍等…');return;}pickEl.hidden=!pickEl.hidden;renderPicker();});
document.getElementById('pickClose').addEventListener('click',()=>{pickEl.hidden=true;canvas.focus();});
netStart();
requestAnimationFrame(frame);
})();
