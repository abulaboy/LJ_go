.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

const P = {"origin":[332.45089007965447,277.0917432260576],"scale":2.802928766179179,"azimuth":135,"elevation":36};
const STROKE = 44;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const roof = svg.querySelector('[data-part="roof"]');
const readout = document.querySelector("[data-readout]");
const slider = document.querySelector("#roof-slider");
const btnClose = document.querySelector("#btn-close");
const btnHalf = document.querySelector("#btn-half");
const btnOpen = document.querySelector("#btn-open");
const btnTour = document.querySelector("#btn-tour");
const still = matchMedia("(prefers-reduced-motion: reduce)");

let travel = 0;
let target = 0;
let vel = 0;
let touring = true;
let visible = false;
let idleTimer = 0;
let frame = 0;
let last = 0;
let clock = 0;

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function updateReadout(t) {
  const meters = (t * 80.0).toFixed(1);
  const percent = Math.round(t * 100);
  let status = "屋頂完全閉合";
  let lux = Math.round(4500 + t * 87500).toLocaleString();
  if (t <= 0.02) {
    status = "屋頂完全閉合 (全天候保溫抗雪模式)";
  } else if (t >= 0.98) {
    status = "屋頂完全開啟 (天然芝全日光光合模式)";
  } else {
    status = "開閉行進中 (4組驅動台車運轉)";
  }
  const text = status + " · 行程 " + meters + " m (" + percent + "%) · 草皮照度 " + lux + " lx";
  if (readout.textContent !== text) readout.textContent = text;
  if (slider && document.activeElement !== slider) slider.value = String(t);
  stage.setAttribute("aria-valuenow", String(percent));
  stage.setAttribute("aria-valuetext", text);
}

function draw() {
  const dx = travel * STROKE;
  roof.setAttribute("transform", translateAlong(P, [dx, 0, 0]));
  updateReadout(travel);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;

  if (touring) {
    clock += dt;
    const cycle = (clock % 10);
    if (cycle < 4) target = 0;
    else if (cycle < 5) target = 0.5;
    else if (cycle < 9) target = 1.0;
    else target = 0.5;
  }

  if (calm) {
    travel = target;
  } else {
    const stiff = 22;
    const damp = 9.5;
    const force = (target - travel) * stiff;
    vel = (vel + force * dt) * Math.exp(-damp * dt);
    travel += vel * dt;
    if (Math.abs(target - travel) < 0.001 && Math.abs(vel) < 0.001) {
      travel = target;
      vel = 0;
    }
  }

  draw();

  const settled = !touring && travel === target && Math.abs(vel) < 0.001;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const steer = (next) => {
  touring = false;
  target = clamp(next, 0, 1);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    clock = 0;
    run();
  }, 6000);
  run();
};

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

if (still.matches) touring = false;

if (slider) {
  slider.addEventListener("input", (e) => steer(parseFloat(e.target.value)));
}
if (btnClose) btnClose.addEventListener("click", () => steer(0));
if (btnHalf) btnHalf.addEventListener("click", () => steer(0.5));
if (btnOpen) btnOpen.addEventListener("click", () => steer(1.0));
if (btnTour) {
  btnTour.addEventListener("click", () => {
    touring = true;
    clock = 0;
    run();
  });
}

stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === "ArrowUp") {
    event.preventDefault();
    steer(Math.min(1, target + 0.25));
  } else if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
    event.preventDefault();
    steer(Math.max(0, target - 0.25));
  } else if (event.key === "Home") {
    event.preventDefault();
    steer(0);
  } else if (event.key === "End") {
    event.preventDefault();
    steer(1);
  }
});

draw();
